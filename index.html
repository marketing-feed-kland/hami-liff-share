<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>好書相報 - 春水小鎮阿財店員</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #666666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-box {
      background-color: #f0f4f8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #34495e;
      text-align: left;
    }
    .info-item {
      margin-bottom: 4px;
    }
    .info-item:last-child {
      margin-bottom: 0;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #06c755;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #05a847;
    }
    .btn:disabled {
      background-color: #cccccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #888888;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🎁</div>
    <h2>好書相報轉分享</h2>
    <p>邀請朋友一起讀好書！點選下方按鈕，挑選 LINE 好友或群組轉發精選書單。</p>

    <div class="info-box">
      <div class="info-item">📚 <strong>分享主題：</strong><span id="displayCat">讀取中...</span></div>
      <div class="info-item">🏷️ <strong>專屬推薦碼：</strong><span id="displayCode">讀取中...</span></div>
    </div>

    <button id="shareBtn" class="btn" disabled>初始化中...</button>
    <div id="statusText" class="status-msg">正在載入 LINE 環境...</div>
  </div>

  <script>
    const LIFF_ID = "2012185997-sJenhi1M";
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwxfWy9bduDRmCTe7x2LoNxb1wRgGC5BpeGU1ncOxz9wQcq64U3-IoquO-1acbRb5M_/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get('cat') || '精選特惠';
    const promoCode = urlParams.get('code') || '';
    let urlUserId = urlParams.get('uid') || '';
    const bidsParam = urlParams.get('bids') || '';

    document.getElementById('displayCat').innerText = category;
    document.getElementById('displayCode').innerText = promoCode || "（未綁定）";

    const shareBtn = document.getElementById('shareBtn');
    const statusText = document.getElementById('statusText');

    let flexMessagePayload = null;

    liff.init({ liffId: LIFF_ID })
      .then(async () => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        if (!urlUserId) {
          try {
            const profile = await liff.getProfile();
            urlUserId = profile.userId || '';
          } catch (e) {}
        }

        // 核心改變：進入頁面即立刻發送「分享次數 +1」打點
        triggerShareCountIncrement(promoCode, urlUserId);

        if (!liff.isApiAvailable('shareTargetPicker')) {
          statusText.innerText = "目前環境未開放好友挑選功能";
          return;
        }

        shareBtn.innerText = "正在組裝精選書單...";
        statusText.innerText = "同步推薦書籍中...";

        // 向 GAS 後端取得完全符合 LINE 規範的 Flex Carousel
        fetchExactCarousel();
      })
      .catch((err) => {
        statusText.innerText = "初始化失敗: " + err.message;
      });

    // 即時打點（點擊呼叫即計數）
    function triggerShareCountIncrement(code, uid) {
      if (!GAS_WEBAPP_URL || GAS_WEBAPP_URL.includes("YOUR_GAS_ID_HERE")) return;
      const countUrl = `${GAS_WEBAPP_URL}?action=record_share&code=${encodeURIComponent(code)}&userId=${encodeURIComponent(uid)}`;
      if (navigator.sendBeacon) {
        navigator.sendBeacon(countUrl);
      } else {
        fetch(countUrl, { method: "GET", mode: "no-cors" });
      }
    }

    // 取得官方結構 Flex
    function fetchExactCarousel() {
      const apiUrl = `${GAS_WEBAPP_URL}?cat=${encodeURIComponent(category)}&code=${encodeURIComponent(promoCode)}&userId=${encodeURIComponent(urlUserId)}&bids=${encodeURIComponent(bidsParam)}`;

      fetch(apiUrl)
        .then(res => res.json())
        .then(resData => {
          if (resData && resData.status === "success" && resData.data) {
            flexMessagePayload = resData.data;
            shareBtn.disabled = false;
            shareBtn.innerText = "挑選好友立即分享";
            statusText.innerText = "已就緒！點擊按鈕即可挑選好友發送。";
          } else {
            fallbackToSingleCard();
          }
        })
        .catch(err => {
          console.warn("無法取得完整書單，使用備份卡片", err);
          fallbackToSingleCard();
        });
    }

    function fallbackToSingleCard() {
      flexMessagePayload = {
        type: "flex",
        altText: `好友向您推薦了【${category}】精選好書`,
        contents: {
          type: "bubble",
          hero: {
            type: "image",
            url: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=500",
            size: "full",
            aspectRatio: "16:9",
            aspectMode: "cover"
          },
          body: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            paddingAll: "15px",
            contents: [
              { type: "text", text: "🎁 好友特惠書單推薦", weight: "bold", size: "md", color: "#2C3E50" },
              { type: "text", text: `您的好友正在春水小鎮書店挑選【${category}】特惠好書，邀您一同閱讀！`, size: "xs", color: "#666666", wrap: true }
            ]
          },
          footer: {
            type: "box",
            layout: "vertical",
            paddingAll: "10px",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#06C755",
                height: "sm",
                action: {
                  type: "uri",
                  label: "前往探索好書",
                  uri: promoCode ? `https://www.hamibook.com.tw?sales_code=${encodeURIComponent(promoCode)}` : "https://www.hamibook.com.tw"
                }
              }
            ]
          }
        }
      };
      shareBtn.disabled = false;
      shareBtn.innerText = "挑選好友立即分享";
      statusText.innerText = "已就緒！點擊按鈕即可挑選好友發送。";
    }

    shareBtn.addEventListener('click', () => {
      if (!flexMessagePayload) return;
      shareBtn.disabled = true;
      statusText.innerText = "開啟挑選面板中...";

      // 嚴格依照 LINE 官方規範以陣列包裹單一 flex 物件傳入
      liff.shareTargetPicker([flexMessagePayload])
        .then((res) => {
          if (res) {
            statusText.innerText = "✅ 分享完成！視窗即將關閉...";
            setTimeout(() => { liff.closeWindow(); }, 500);
          } else {
            shareBtn.disabled = false;
            statusText.innerText = "已取消分享";
          }
        })
        .catch((err) => {
          shareBtn.disabled = false;
          statusText.innerText = "分享未成功：" + err.message;
        });
    });
  </script>
</body>
</html>
