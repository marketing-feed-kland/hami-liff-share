<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>好書分享推薦</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    .card-box {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon {
      font-size: 44px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: #111;
      margin-bottom: 8px;
    }
    .status {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-share {
      display: none;
      width: 100%;
      background-color: #06C755;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 0;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
      transition: background-color 0.2s;
    }
    .btn-share:active {
      background-color: #05a847;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e3e3e3;
      border-top: 3px solid #06C755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .err-log {
      margin-top: 16px;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
      display: none;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="card-box">
    <div class="spinner" id="spinner"></div>
    <div class="icon" id="headerIcon" style="display: none;">📚</div>
    <div class="title" id="mainTitle">準備專屬書單中</div>
    <div class="status" id="statusText">正在驗證授權環境...</div>
    
    <!-- 核心：由使用者主動點擊按鈕，避開 EXCEPTION_IN_SUBWINDOW -->
    <button class="btn-share" id="shareBtn" onclick="handleShareClick()">選擇好友／群組發送</button>
    <div class="err-log" id="errLog"></div>
  </div>

  <script>
    const MY_LIFF_ID = "2012185997-sJenhi1M";
    let cachedFlexMessage = null;

    function showDebugError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("headerIcon").style.display = "block";
      document.getElementById("headerIcon").innerText = "⚠️";
      document.getElementById("mainTitle").innerText = "設定或環境提醒";
      document.getElementById("statusText").innerText = "無法開啟分享功能";
      const errEl = document.getElementById("errLog");
      errEl.style.display = "block";
      errEl.innerText = msg;
    }

    function updateStatus(title, text) {
      if (title) document.getElementById("mainTitle").innerText = title;
      if (text) document.getElementById("statusText").innerText = text;
    }

    async function main() {
      try {
        await liff.init({ liffId: MY_LIFF_ID });

        // 登入驗證
        if (!liff.isLoggedIn()) {
          updateStatus("驗證身分", "正在跳轉至授權畫面...");
          liff.login({ redirectUri: window.location.href });
          return;
        }

        // 檢查環境支援度
        if (!liff.isApiAvailable("shareTargetPicker")) {
          showDebugError("您的環境不支援 shareTargetPicker，請確認後台 Share Target Picker 為 ON，且在手機版 LINE App 中打開！");
          return;
        }

        // 解析推廣參數並預先組裝好卡片
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get("cat") || "熱門特惠";
        const salesCode = urlParams.get("code") || "PROMO";

        cachedFlexMessage = buildStandardFlexCarousel(category, salesCode);

        // 隱藏 Spinner，顯示分享按鈕
        document.getElementById("spinner").style.display = "none";
        document.getElementById("headerIcon").style.display = "block";
        updateStatus("【" + category + "】限時書單", "點擊下方按鈕即可選擇好友或 LINE 群組發送推薦卡片！");
        document.getElementById("shareBtn").style.display = "block";

      } catch (err) {
        let detail = "";
        try {
          detail = JSON.stringify(err, Object.getOwnPropertyNames(err));
        } catch (e) {
          detail = err.message || err.toString();
        }
        showDebugError("錯誤詳情：" + (err.message || detail));
      }
    }

    // 由使用者的 Click 事件觸發，確保符合瀏覽器與原生安全規範
    async function handleShareClick() {
      if (!cachedFlexMessage) return;

      const btn = document.getElementById("shareBtn");
      btn.disabled = true;
      btn.innerText = "正在開啟好友選單...";

      try {
        const res = await liff.shareTargetPicker([cachedFlexMessage]);
        if (res) {
          updateStatus("發送成功！", "好書推薦卡片已成功送出！視窗即將關閉...");
          btn.style.display = "none";
          setTimeout(() => liff.closeWindow(), 1200);
        } else {
          // 使用者在好友選擇器中點了取消
          btn.disabled = false;
          btn.innerText = "選擇好友／群組發送";
          updateStatus("未發送", "您已取消選擇，隨時可再次點擊按鈕分享。");
        }
      } catch (error) {
        btn.disabled = false;
        btn.innerText = "重新嘗試發送";
        showDebugError("發送失敗：" + (error.message || JSON.stringify(error)));
      }
    }

    // ── 組裝標準輪播卡片 ──
    function buildStandardFlexCarousel(category, salesCode) {
      const safeCat = category || "熱門特惠";
      const code = salesCode || "PROMO";
      const promoUrl = "https://hamibook.tw/sale/" + encodeURIComponent(code);

      return {
        type: "flex",
        altText: `📚 好友為您推薦【${safeCat}】即將截止特價好書！`,
        contents: {
          type: "carousel",
          contents: [
            // 卡片 1：精選書籍卡片
            {
              type: "bubble",
              size: "mega",
              hero: {
                type: "image",
                url: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&auto=format&fit=crop&q=60",
                size: "full",
                aspectRatio: "20:13",
                aspectMode: "cover"
              },
              body: {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                paddingAll: "16px",
                contents: [
                  {
                    type: "text",
                    text: `【${safeCat}】限時精選好書`,
                    weight: "bold",
                    size: "md",
                    wrap: true
                  },
                  {
                    type: "box",
                    layout: "horizontal",
                    spacing: "xs",
                    margin: "xs",
                    contents: [
                      {
                        type: "text",
                        text: "💡",
                        size: "xs",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "直擊痛點精選，限時特惠不容錯過的深度好書！",
                        size: "xs",
                        color: "#2e7d32",
                        wrap: true
                      }
                    ]
                  },
                  {
                    type: "box",
                    layout: "baseline",
                    spacing: "sm",
                    margin: "md",
                    contents: [
                      {
                        type: "text",
                        text: "NT$ 99 起",
                        size: "lg",
                        color: "#ff334b",
                        weight: "bold",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "NT$ 320",
                        size: "xs",
                        color: "#aaaaaa",
                        decoration: "line-through",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "即將截止",
                        size: "xxs",
                        color: "#ff8800",
                        align: "end"
                      }
                    ]
                  }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                spacing: "xs",
                paddingAll: "12px",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#4A90E2",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "立即查看促銷書單",
                      uri: promoUrl
                    }
                  }
                ]
              }
            },
            // 卡片 2：推廣導流末卡
            {
              type: "bubble",
              size: "mega",
              body: {
                type: "box",
                layout: "vertical",
                justifyContent: "center",
                alignItems: "center",
                spacing: "md",
                paddingAll: "20px",
                contents: [
                  {
                    type: "text",
                    text: "🎁 好康相報",
                    weight: "bold",
                    size: "xl"
                  },
                  {
                    type: "text",
                    text: `推薦碼：${code}\n快把這份特價書單分享給愛閱讀的朋友！`,
                    size: "xs",
                    color: "#666666",
                    align: "center",
                    wrap: true
                  },
                  {
                    type: "button",
                    style: "primary",
                    color: "#06C755",
                    margin: "md",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "前往全站促銷會場",
                      uri: promoUrl
                    }
                  }
                ]
              }
            }
          ]
        }
      };
    }

    main();
  </script>
</body>
</html>
