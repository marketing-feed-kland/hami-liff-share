<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在為您開啟好書分享...</title>
  <!-- 引入 LINE 官方 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e3e3e3;
      border-top: 4px solid #06C755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tip {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="tip" id="statusText">正在準備專屬推薦卡片，請稍候...</div>

  <script>
    // ── 請填入你在 LINE Developers 建立的 LIFF ID ──
    const MY_LIFF_ID = "YOUR_LIFF_ID_HERE";

    async function main() {
      const statusEl = document.getElementById("statusText");

      try {
        // 1. 初始化 LIFF
        await liff.init({ liffId: MY_LIFF_ID });

        // 2. 若未登入 LINE，強制引導登入
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 3. 檢查環境是否支援 shareTargetPicker
        if (!liff.isApiAvailable("shareTargetPicker")) {
          alert("很抱歉，您的 LINE 版本不支援直接分享卡片功能。");
          liff.closeWindow();
          return;
        }

        // 4. 解析網址傳入的參數
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get("cat") || "熱門特惠";
        const salesCode = urlParams.get("code") || "DEFAULT";

        // 5. 提示使用者
        statusEl.innerText = `正在喚起好友選擇器（分類：${category}）...`;

        // 6. 組裝預備發送的 Flex 輪播卡片 (帶上該推廣碼與二次分享連結)
        const flexMessage = buildShareFlexMessage(category, salesCode);

        // 7. 喚起 LINE 原生分享對象選擇器
        const res = await liff.shareTargetPicker([flexMessage]);

        if (res) {
          // 發送成功，關閉 LIFF 視窗回到對話框
          liff.closeWindow();
        } else {
          // 用戶自行按下取消發送
          liff.closeWindow();
        }
      } catch (err) {
        console.error("LIFF Share Error: ", err);
        statusEl.innerText = "分享未完成，請稍後重試。";
        setTimeout(() => liff.closeWindow(), 2000);
      }
    }

    // ── 組裝標準 Flex 輪播卡片（末卡支援無限二次裂變分享） ──
    function buildShareFlexMessage(category, salesCode) {
      // 構建帶推廣碼的短網址
      const promoUrl = `https://hamibook.tw/sale/${encodeURIComponent(salesCode)}`;
      // 構建下一位朋友點擊後可再次調用本 LIFF 的二次裂變連結
      const nextLiffShareUrl = `https://liff.line.me/${MY_LIFF_ID}?cat=${encodeURIComponent(category)}&code=${encodeURIComponent(salesCode)}`;

      return {
        type: "flex",
        altText: `📚 好友推薦給您【${category}】即將截止特價好書！`,
        contents: {
          type: "carousel",
          contents: [
            {
              type: "bubble",
              size: "micro",
              hero: {
                type: "image",
                url: "https://storage.googleapis.com/hamibook-promotion-export/default_cover.jpg",
                size: "full",
                aspectRatio: "3:4",
                aspectMode: "cover"
              },
              body: {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                paddingAll: "10px",
                contents: [
                  {
                    type: "text",
                    text: `【${category}】限時精選特惠`,
                    weight: "bold",
                    size: "sm",
                    wrap: true
                  },
                  {
                    type: "text",
                    text: "好友為您挑選的即將截止好書",
                    size: "xs",
                    color: "#888888"
                  }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                spacing: "xs",
                paddingAll: "8px",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#4A90E2",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "查看書單",
                      uri: promoUrl
                    }
                  }
                ]
              }
            },
            {
              type: "bubble",
              size: "micro",
              body: {
                type: "box",
                layout: "vertical",
                justifyContent: "center",
                alignItems: "center",
                spacing: "md",
                paddingAll: "15px",
                contents: [
                  {
                    type: "text",
                    text: "🎁 好康再轉發",
                    weight: "bold",
                    size: "md"
                  },
                  {
                    type: "text",
                    text: `推薦碼：${salesCode}\n覺得這批好書超值？一鍵轉發給更多喜愛閱讀的朋友！`,
                    size: "xs",
                    color: "#666666",
                    wrap: true
                  },
                  {
                    type: "button",
                    style: "primary",
                    color: "#06C755",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "一鍵分享朋友",
                      uri: nextLiffShareUrl
                    }
                  }
                ]
              }
            }
          ]
        }
      };
    }

    // 啟動主流程
    main();
  </script>
</body>
</html>
