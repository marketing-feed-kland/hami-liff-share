<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好書相報 - 春水小鎮阿財店員</title>
  <!-- 引入 LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f5f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      text-align: center;
    }
    .gift-icon {
      font-size: 56px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 12px;
    }
    .desc {
      font-size: 14px;
      color: #718096;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-box {
      background-color: #f7fafc;
      border: 1px solid #edf2f7;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      margin-bottom: 24px;
    }
    .info-item {
      font-size: 14px;
      color: #4a5568;
      line-height: 1.8;
      word-break: break-all;
    }
    .info-label {
      font-weight: 600;
      color: #2d3748;
    }
    .btn {
      width: 100%;
      background-color: #00c300;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn:disabled {
      background-color: #cbd5e0 !important;
      cursor: not-allowed;
    }
    .btn:active {
      background-color: #00a000;
    }
    .subtext {
      margin-top: 14px;
      font-size: 12px;
      color: #a0aec0;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="gift-icon">🎁</div>
    <div class="title">好書相報轉分享</div>
    <div class="desc">
      邀請朋友一起讀好書！點選下方按鈕，挑選 LINE 好友或群組轉發精選書單。
    </div>

    <!-- 容器保留空白，由 JS 即刻填入動態資料，不放任何靜態預設字 -->
   <div class="info-box">
      <div class="info-item">
        <span class="info-label">📚 分享主題：</span>
        <span id="topicDisplay"></span>
      </div>
      <div class="info-item">
        <span id="refDisplay" class="info-label" style="color: #2b6cb0;"></span>
      </div>
    </div>

    <!-- 按鈕初始不放字，避免初始化延遲產生誤導 -->
    <button id="shareBtn" class="btn" disabled></button>
    <div id="subtext" class="subtext"></div>
  </div>

  <script>
    // ========== 1. 核心參數設定 ==========
    const LIFF_ID = "2012185997-sJenhi1"; // LIFF ID
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxfWy9bduDRmCTe7x2LoNxb1wRgGC5BpeGU1ncOxz9wQcq64U3-IoquO-1acbRb5M_/exec"; // 請填入固定版 GAS Web App 網址

    let topicName = "精選好書推薦";
    let refCode = "";
    let bookList = [];
    let isSubmitting = false;

// ========== 2. 立即解析 URL 參數並填入畫面 ==========
    (function parseAndFillImmediately() {
      try {
        const params = new URLSearchParams(window.location.search);

        // 主題解析與過濾
        const rawTopic = params.get('topic');
        if (rawTopic && !rawTopic.startsWith('U')) {
          topicName = decodeURIComponent(rawTopic);
        }

        // 推薦碼解析
        refCode = params.get('ref') || "";

        // 動態書籍陣列解析
        const booksParam = params.get('books');
        if (booksParam) {
          const rawItems = booksParam.split(',');
          bookList = rawItems.map(item => {
            const parts = decodeURIComponent(item).split('|');
            return {
              title: parts[0] ? parts[0].trim() : "精選書籍",
              salePrice: parts[1] ? parts[1].trim() : "",
              origPrice: parts[2] ? parts[2].trim() : "",
              imageUrl: parts[3] ? parts[3].trim() : "https://placehold.co/300x400?text=Book",
              bookUrl: parts[4] ? parts[4].trim() : ""
            };
          }).filter(b => b.title !== "");
        }

        // 即時渲染至頁面
        document.getElementById('topicDisplay').textContent = topicName;

        // 渲染文案：來自Hami書城(231)的推薦
        const refDisplayEl = document.getElementById('refDisplay');
        if (refCode) {
          refDisplayEl.textContent = `🎁 來自Hami書城(${refCode})的推薦`;
        } else {
          refDisplayEl.textContent = `🎁 來自Hami書城的推薦`;
        }

      } catch (e) {
        console.error("參數解析失敗：", e);
      }
    })();

    // ========== 3. LIFF 環境初始化與按鈕狀態控管 ==========
    window.onload = async function() {
      const shareBtn = document.getElementById("shareBtn");
      const subtext = document.getElementById("subtext");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          shareBtn.textContent = "請登入 LINE";
          shareBtn.disabled = false;
          shareBtn.onclick = () => liff.login();
          subtext.textContent = "需登入 LINE 帳號以啟用好友分享";
          return;
        }

        if (bookList.length === 0) {
          shareBtn.textContent = "查無待分享書單";
          shareBtn.disabled = true;
          subtext.textContent = "未接收到待轉發的書籍清單";
          return;
        }

        // 環境就緒
        shareBtn.textContent = "挑選好友立即分享";
        shareBtn.disabled = false;
        subtext.textContent = "點選按鈕挑選好友即可發送！";

      } catch (err) {
        console.error("LIFF 載入失敗：", err);
        shareBtn.textContent = "請於手機 LINE 開啟";
        shareBtn.disabled = true;
      }

      setupEventListeners();
    };

    // ========== 4. 組裝 Flex Message 多本輪播 + 尾張轉分享卡片（裂變繼承推薦碼） ==========
    function buildBookFlexMessage() {
      if (bookList.length === 0) return null;

      // 4-1. 書籍 Bubble 陣列
      const bookBubbles = bookList.map(book => {
        const priceContents = [];
        if (book.salePrice) {
          priceContents.push({
            type: "text",
            text: book.salePrice,
            color: "#e53e3e",
            size: "sm",
            weight: "bold",
            flex: 0
          });
        }
        if (book.origPrice) {
          priceContents.push({
            type: "text",
            text: book.origPrice,
            color: "#aaaaaa",
            size: "xxs",
            decoration: "line-through",
            margin: "sm"
          });
        }

        return {
          type: "bubble",
          size: "micro",
          hero: {
            type: "image",
            url: book.imageUrl,
            size: "full",
            aspectMode: "cover",
            aspectRatio: "3:4"
          },
          body: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            paddingAll: "10px",
            contents: [
              {
                type: "text",
                text: book.title,
                weight: "bold",
                size: "sm",
                wrap: true,
                maxLines: 2
              },
              ...(priceContents.length > 0 ? [{
                type: "box",
                layout: "baseline",
                contents: priceContents
              }] : [])
            ]
          },
          footer: {
            type: "box",
            layout: "vertical",
            paddingAll: "8px",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#00c300",
                height: "sm",
                action: {
                  type: "uri",
                  label: "登入領取好書",
                  uri: book.bookUrl || `https://liff.line.me/${LIFF_ID}?ref=${refCode}`
                }
              }
            ]
          }
        };
      });

      // 4-2. 重新打包原始書籍字串，確保 B/C/D 轉發時書單與最初 A 的推薦碼完全一致
      const booksParamString = bookList.map(b => 
        `${b.title}|${b.salePrice}|${b.origPrice}|${b.imageUrl}|${b.bookUrl}`
      ).join(",");

      const chainShareUrl = `https://liff.line.me/${LIFF_ID}?topic=${encodeURIComponent(topicName)}&ref=${encodeURIComponent(refCode)}&books=${encodeURIComponent(booksParamString)}`;

      // 4-3. 最後一張：好書相報轉分享 Bubble 卡片
      const shareActionBubble = {
        type: "bubble",
        size: "micro",
        body: {
          type: "box",
          layout: "vertical",
          spacing: "md",
          justifyContent: "center",
          alignItems: "center",
          paddingAll: "14px",
          contents: [
            {
              type: "text",
              text: "🎁",
              size: "xxl",
              align: "center"
            },
            {
              type: "text",
              text: "好書相報轉分享",
              weight: "bold",
              size: "md",
              align: "center",
              wrap: true
            },
            {
              type: "text",
              text: "挑選 LINE 好友或群組\n轉發這組精選好書",
              size: "xxs",
              color: "#888888",
              align: "center",
              wrap: true
            }
          ]
        },
        footer: {
          type: "box",
          layout: "vertical",
          paddingAll: "8px",
          contents: [
            {
              type: "button",
              style: "primary",
              color: "#00c300",
              height: "sm",
              action: {
                type: "uri",
                label: "好書相報轉分享",
                uri: chainShareUrl
              }
            }
          ]
        }
      };

      // 4-4. 合併為同一個 Carousel 輪播
      return {
        type: "flex",
        altText: `好友贈書推薦：${topicName}`,
        contents: {
          type: "carousel",
          contents: [...bookBubbles, shareActionBubble]
        }
      };
    }

    // ========== 5. 綁定按鈕點擊與發送流程 ==========
    function setupEventListeners() {
      const shareBtn = document.getElementById("shareBtn");
      if (!shareBtn) return;

      shareBtn.addEventListener("click", async () => {
        if (isSubmitting || bookList.length === 0) return;

        if (!liff.isApiAvailable("shareTargetPicker")) {
          alert("目前環境不支援挑選好友功能，請於手機 LINE 應用程式內開啟。");
          return;
        }

        try {
          const flexContent = buildBookFlexMessage();
          if (!flexContent) return;

          // 開啟原生好友選擇視窗
          const res = await liff.shareTargetPicker([flexContent]);

          if (res) {
            isSubmitting = true;
            shareBtn.textContent = "紀錄中...";
            shareBtn.disabled = true;

            // 安全回傳 Access Token 給後端 GAS 累計次數
            await sendShareRecordToGas();

            alert("分享成功！推薦次數已累計。");
            liff.closeWindow();
          }
        } catch (err) {
          console.error("分享流程發生錯誤：", err);
          alert("分享發生錯誤，請稍後再試。");
        } finally {
          isSubmitting = false;
          if (shareBtn && bookList.length > 0) {
            shareBtn.textContent = "挑選好友立即分享";
            shareBtn.disabled = false;
          }
        }
      });
    }

    // ========== 6. 安全呼叫 GAS Web App ==========
    async function sendShareRecordToGas() {
      try {
        const token = liff.getAccessToken();
        if (!token) return;

        await fetch(GAS_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: new URLSearchParams({
            action: "incrementShare",
            token: token,
            refCode: refCode,
            topic: topicName,
            bookCount: bookList.length,
            timestamp: new Date().toISOString()
          })
        });
      } catch (err) {
        console.error("累計發送失敗：", err);
      }
    }
  </script>
</body>
</html>
