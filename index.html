<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在開啟好書分享...</title>
  <!-- 引入 LINE 官方 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e3e3e3;
      border-top: 4px solid #06C755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      font-size: 15px;
      color: #444;
      line-height: 1.6;
    }
    .err-log {
      margin-top: 20px;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
      display: none;
      width: 100%;
      max-width: 360px;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="statusText">正在準備專屬推薦卡片，請稍候...</div>
  <div class="err-log" id="errLog"></div>

  <script>
    // ⚠️ 務必填入你在 LINE Login Channel 拿到的真實 LIFF ID（例如：2007xxxxxx-Abcd1234）
    const MY_LIFF_ID = "2012185997-sJenhi1M";

    function showDebugError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("statusText").innerText = "❌ 啟動分享失敗";
      const errEl = document.getElementById("errLog");
      errEl.style.display = "block";
      errEl.innerText = msg;
    }

    function updateStatus(text) {
      document.getElementById("statusText").innerText = text;
    }

    async function main() {
      // 1. 檢查 LIFF ID 是否有填入
      if (!MY_LIFF_ID || MY_LIFF_ID.includes("YOUR_LIFF_ID")) {
        showDebugError("錯誤：未填入正確的 MY_LIFF_ID，請至 GitHub index.html 設定真實 LIFF ID！");
        return;
      }

      try {
        updateStatus("正在連線 LINE 服務 (init)...");
        await liff.init({ liffId: MY_LIFF_ID });

        // 2. 登入檢查
        if (!liff.isLoggedIn()) {
          updateStatus("引導授權登入中...");
          liff.login();
          return;
        }

        // 3. 檢查 API 是否可用
        if (!liff.isApiAvailable("shareTargetPicker")) {
          showDebugError("您的環境不支援 shareTargetPicker，請確認後台開關為 ON 且由手機 LINE 內部開啟！");
          return;
        }

        updateStatus("解析推廣參數中...");
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get("cat") || "熱門特惠";
        const salesCode = urlParams.get("code") || "PROMO";

        updateStatus("正在喚起 LINE 好友選擇器...");
        const flexMessage = buildSafeFlexCard(category, salesCode);

        // 4. 喚起分享器
        const res = await liff.shareTargetPicker([flexMessage]);

        if (res) {
          updateStatus("✅ 卡片已成功發送！");
          setTimeout(() => liff.closeWindow(), 800);
        } else {
          updateStatus("已取消分享");
          setTimeout(() => liff.closeWindow(), 800);
        }

      } catch (err) {
        showDebugError("執行例外中斷：" + (err.message || err.toString()));
      }
    }

    // 產生百分之百符合 LINE 官方驗證的標準安全 Flex 結構
    function buildSafeFlexCard(category, salesCode) {
      const code = salesCode || "PROMO";
      const promoUrl = "https://hamibook.tw/sale/" + encodeURIComponent(code);
      const nextShareUrl = "https://liff.line.me/" + MY_LIFF_ID + "?cat=" + encodeURIComponent(category) + "&code=" + encodeURIComponent(code);

      return {
        type: "flex",
        altText: "📚 好友推薦給您【" + category + "】即將截止特價好書！",
        contents: {
          type: "carousel",
          contents: [
            {
              type: "bubble",
              size: "micro",
              hero: {
                type: "image",
                url: "https://storage.googleapis.com/hamibook-promotion-export/default_cover.jpg",
                size: "full",
                aspectRatio: "3:4",
                aspectMode: "cover"
              },
              body: {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                paddingAll: "10px",
                contents: [
                  {
                    type: "text",
                    text: "【" + category + "】限時精選",
                    weight: "bold",
                    size: "sm",
                    wrap: true
                  },
                  {
                    type: "text",
                    text: "好友為您挑選的即將截止特惠書",
                    size: "xs",
                    color: "#888888"
                  }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                spacing: "xs",
                paddingAll: "8px",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#4A90E2",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "查看書單",
                      uri: promoUrl
                    }
                  }
                ]
              }
            },
            {
              type: "bubble",
              size: "micro",
              body: {
                type: "box",
                layout: "vertical",
                justifyContent: "center",
                alignItems: "center",
                spacing: "md",
                paddingAll: "15px",
                contents: [
                  {
                    type: "text",
                    text: "🎁 好康再轉發",
                    weight: "bold",
                    size: "md"
                  },
                  {
                    type: "text",
                    text: "推薦碼：" + code + "\n覺得好書超值？一鍵分享給喜愛閱讀的朋友！",
                    size: "xs",
                    color: "#666666",
                    wrap: true
                  },
                  {
                    type: "button",
                    style: "primary",
                    color: "#06C755",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "一鍵分享朋友",
                      uri: nextShareUrl
                    }
                  }
                ]
              }
            }
          ]
        }
      };
    }

    main();
  </script>
</body>
</html>
