<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>好書相報 - 春水小鎮阿財店員</title>
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
  <script>var vConsole = new VConsole();</script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f7f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 400px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }
    .icon {
      font-size: 54px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #666666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .info-box {
      background-color: #f0f4f8;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 24px;
      font-size: 13px;
      color: #34495e;
      text-align: left;
    }
    .info-item {
      margin-bottom: 4px;
    }
    .info-item:last-child {
      margin-bottom: 0;
    }
    .btn {
      display: block;
      width: 100%;
      background-color: #06c755;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
      transition: background 0.2s, transform 0.1s;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #05a847;
    }
    .btn:disabled {
      background-color: #cccccc;
      box-shadow: none;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #888888;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🎁</div>
    <h2>好書相報轉分享</h2>
    <p>邀請朋友一起讀好書！點選下方按鈕，挑選 LINE 好友或群組轉發精選書單。</p>

    <div class="info-box">
      <div class="info-item">📚 <strong>分享主題：</strong><span id="displayCat">讀取中...</span></div>
      <div class="info-item">🏷️ <strong>專屬推薦碼：</strong><span id="displayCode">讀取中...</span></div>
    </div>

    <button id="shareBtn" class="btn" disabled>初始化中...</button>
    <div id="statusText" class="status-msg">正在載入 LINE 環境...</div>
  </div>

	<!-- 引入 LINE LIFF SDK -->
	<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

	<script>
	// ========== 1. 基礎設定 ==========
	const LIFF_ID = "2012185997-sJenhi1M"; // 請替換為您的 LIFF ID
	const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwxfWy9bduDRmCTe7x2LoNxb1wRgGC5BpeGU1ncOxz9wQcq64U3-IoquO-1acbRb5M_/exec"; // 請替換為固定版本的 GAS Web App 網址

	let topicName = "";
	let refCode = "";
	let bookList = [];
	let isSubmitting = false; // 防連點開關

	window.onload = async function() {
	  await initLiff();
	  parseUrlParams();
	  renderUiInfo();
	  setupEventListeners();
	};

	// ========== 2. LIFF 初始化 ==========
	async function initLiff() {
	  try {
		await liff.init({ liffId: LIFF_ID });
		// 若未在 LINE 授權登入，自動導向登入以確保能取得 Access Token
		if (!liff.isLoggedIn()) {
		  liff.login();
		}
	  } catch (err) {
		console.error("LIFF 初始化失敗：", err);
	  }
	}

	// ========== 3. 解析 URL 參數（方案 B：純動態解析） ==========
	function parseUrlParams() {
	  const params = new URLSearchParams(window.location.search);
	  
	  // 主題名稱過濾：若未傳或誤傳為 User ID，提供預設值
	  const rawTopic = params.get('topic');
	  if (rawTopic && !rawTopic.startsWith('U')) {
		topicName = decodeURIComponent(rawTopic);
	  } else {
		topicName = "精選好書推薦";
	  }

	  // 專屬推薦碼
	  refCode = params.get('ref') || "";

	  // 解析書籍陣列 (格式：書名|特價|原價|圖片網址|導購網址)
	  const booksParam = params.get('books');
	  if (booksParam) {
		try {
		  const bookItems = decodeURIComponent(booksParam).split(',');
		  bookList = bookItems.map(item => {
			const parts = item.split('|');
			return {
			  title: parts[0] || "精選書籍",
			  salePrice: parts[1] || "",
			  origPrice: parts[2] || "",
			  imageUrl: parts[3] || "https://placehold.co/300x400?text=Book",
			  bookUrl: parts[4] || ""
			};
		  }).filter(b => b.title.trim() !== "");
		} catch (e) {
		  console.error("解析 URL 書籍資料失敗：", e);
		  bookList = [];
		}
	  }
	}

	// ========== 4. 畫面資訊更新與狀態控制 ==========
	function renderUiInfo() {
	  const topicElement = document.getElementById("topic-display");
	  if (topicElement) {
		topicElement.innerText = topicName;
	  }
	  
	  const refElement = document.getElementById("ref-display");
	  if (refElement) {
		refElement.innerText = refCode || "--";
	  }

	  // 若無書籍資料，鎖定按鈕避免送出空訊息
	  const shareBtn = document.getElementById("share-btn");
	  if (bookList.length === 0 && shareBtn) {
		shareBtn.style.backgroundColor = "#cccccc";
		shareBtn.style.cursor = "not-allowed";
		shareBtn.innerText = "查無待分享書單";
	  }
	}

	// ========== 5. 組裝多本輪播 Flex Message ==========
	function buildBookFlexMessage() {
	  if (bookList.length === 0) return null;

	  const bubbles = bookList.map(book => {
		const priceContents = [];
		if (book.salePrice) {
		  priceContents.push({
			type: "text",
			text: book.salePrice,
			color: "#e53e3e",
			size: "sm",
			weight: "bold",
			flex: 0
		  });
		}
		if (book.origPrice) {
		  priceContents.push({
			type: "text",
			text: book.origPrice,
			color: "#aaaaaa",
			size: "xxs",
			decoration: "line-through",
			margin: "sm"
		  });
		}

		return {
		  type: "bubble",
		  size: "micro",
		  hero: {
			type: "image",
			url: book.imageUrl,
			size: "full",
			aspectMode: "cover",
			aspectRatio: "3:4"
		  },
		  body: {
			type: "box",
			layout: "vertical",
			spacing: "sm",
			paddingAll: "10px",
			contents: [
			  {
				type: "text",
				text: book.title,
				weight: "bold",
				size: "sm",
				wrap: true,
				maxLines: 2
			  },
			  ...(priceContents.length > 0 ? [{
				type: "box",
				layout: "baseline",
				contents: priceContents
			  }] : [])
			]
		  },
		  footer: {
			type: "box",
			layout: "vertical",
			paddingAll: "8px",
			contents: [
			  {
				type: "button",
				style: "primary",
				color: "#00c300",
				height: "sm",
				action: {
				  type: "uri",
				  label: "登入領取好書",
				  uri: book.bookUrl || `https://liff.line.me/${LIFF_ID}?ref=${refCode}`
				}
			  }
			]
		  }
		};
	  });

	  return {
		type: "flex",
		altText: `好友贈書推薦：${topicName}`,
		contents: {
		  type: "carousel",
		  contents: bubbles
		}
	  };
	}

	// ========== 6. 綁定按鈕與安全送出流程 ==========
	function setupEventListeners() {
	  const shareBtn = document.getElementById("share-btn");
	  if (!shareBtn) return;

	  shareBtn.addEventListener("click", async () => {
		// 1. 防重複點擊
		if (isSubmitting) return;

		if (bookList.length === 0) {
		  alert("目前連結中未包含任何書籍資料。");
		  return;
		}

		if (!liff.isApiAvailable("shareTargetPicker")) {
		  alert("目前環境不支援好友分享功能，請於手機 LINE 應用程式內開啟。");
		  return;
		}

		try {
		  const flexContent = buildBookFlexMessage();
		  if (!flexContent) return;

		  // 呼叫 LINE 分享視窗
		  const res = await liff.shareTargetPicker([flexContent]);

		  if (res) {
			// 設定鎖定狀態與按鈕載入提示
			isSubmitting = true;
			shareBtn.innerText = "紀錄中，請稍候...";
			shareBtn.style.opacity = "0.7";

			// 安全發送：只帶 Token，不帶明文 userId
			await recordShareCountSecurely();

			alert("分享成功！推薦次數已累計。");
			liff.closeWindow();
		  } else {
			console.log("使用者關閉分享視窗");
		  }
		} catch (err) {
		  console.error("分享流程發生錯誤：", err);
		  alert("分享失敗，請稍後再試。");
		} finally {
		  isSubmitting = false;
		  if (shareBtn && bookList.length > 0) {
			shareBtn.innerText = "挑選好友立即分享";
			shareBtn.style.opacity = "1";
		  }
		}
	  });
	}

	// ========== 7. 安全回傳累計次數（發送動態 Access Token） ==========
	async function recordShareCountSecurely() {
	  try {
		// 取得 LINE 授權的短效憑證
		const accessToken = liff.getAccessToken();

		if (!accessToken) {
		  console.warn("無法取得 LINE Access Token，略過累計");
		  return;
		}

		// 發送至後端 GAS
		await fetch(GAS_API_URL, {
		  method: "POST",
		  mode: "no-cors",
		  headers: {
			"Content-Type": "application/x-www-form-urlencoded"
		  },
		  body: new URLSearchParams({
			action: "incrementShare",
			token: accessToken, // 傳送短效憑證進行後端鑑權
			refCode: refCode,
			topic: topicName,
			bookCount: bookList.length,
			timestamp: new Date().toISOString()
		  })
		});
		console.log("累計次數請求已送出");
	  } catch (err) {
		console.error("累計次數發送失敗：", err);
	  }
	}
	</script>
</body>
</html>
