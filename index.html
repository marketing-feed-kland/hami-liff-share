<script>
    const LIFF_ID = "2012185997-sJenhi1M"; 
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwxfWy9bduDRmCTe7x2LoNxb1wRgGC5BpeGU1ncOxz9wQcq64U3-IoquO-1acbRb5M_/exec";

    const urlParams = new URLSearchParams(window.location.search);
    let category = (urlParams.get('cat') || '精選好書').replace(/[🔥⏳📚]/g, '').trim();
    const promoCode = (urlParams.get('code') || '').trim();
    const bidsParam = (urlParams.get('bids') || '').trim();

    // 防呆：若 cat 不小心傳入 U 開頭的 33 碼 LINE User ID，強制轉回精選好書
    if (category.startsWith("U") && category.length === 33) {
      category = "精選好書";
    }

    // 介面渲染：只呈現乾淨主題與推廣碼
    document.getElementById('displayCat').innerText = category;
    document.getElementById('displayCode').innerText = promoCode ? promoCode : "官方精選";

    const shareBtn = document.getElementById('shareBtn');
    const statusText = document.getElementById('statusText');

    let flexMessagePayload = null;

    liff.init({ liffId: LIFF_ID })
      .then(async () => {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // 從 LINE 環境靜默抓取目前使用者的 userId（不顯示在畫面上）
        let currentUid = "";
        try {
          const profile = await liff.getProfile();
          currentUid = profile.userId || "";
        } catch (e) {}

        // 雙保險打點：有 uid 帶 uid，有 code 帶 code，保證後端 100% 成功 +1
        triggerShareCountIncrement(promoCode, currentUid);

        if (!liff.isApiAvailable('shareTargetPicker')) {
          statusText.innerText = "目前環境未開放好友挑選功能";
          return;
        }

        shareBtn.innerText = "正在組裝精選書單...";
        statusText.innerText = "同步推薦書籍中...";

        // 載入輪播書單
        loadCarouselViaJSONP(currentUid);
      })
      .catch((err) => {
        statusText.innerText = "初始化失敗: " + err.message;
      });

    // 背景非同步打點累加次數
    function triggerShareCountIncrement(code, uid) {
      if (!GAS_WEBAPP_URL) return;
      const countUrl = `${GAS_WEBAPP_URL}?action=record_share&code=${encodeURIComponent(code)}&userId=${encodeURIComponent(uid)}`;
      if (navigator.sendBeacon) {
        navigator.sendBeacon(countUrl);
      } else {
        const img = new Image();
        img.src = countUrl;
      }
    }

    // JSONP 回呼
    window.handleBookCarouselResponse = function(response) {
      if (response && response.status === "success" && response.data) {
        flexMessagePayload = response.data;
        shareBtn.disabled = false;
        shareBtn.innerText = "挑選好友立即分享";
        statusText.innerText = "書單已就緒！點擊按鈕即可挑選好友發送。";
      } else {
        fallbackToSingleCard();
      }
    };

    function loadCarouselViaJSONP(uid) {
      if (!GAS_WEBAPP_URL || !bidsParam) {
        fallbackToSingleCard();
        return;
      }

      const script = document.createElement('script');
      script.src = `${GAS_WEBAPP_URL}?cat=${encodeURIComponent(category)}&code=${encodeURIComponent(promoCode)}&userId=${encodeURIComponent(uid)}&bids=${encodeURIComponent(bidsParam)}&callback=handleBookCarouselResponse`;
      script.onerror = function() {
        console.warn("JSONP 載入失敗，使用備用卡片");
        fallbackToSingleCard();
      };
      document.body.appendChild(script);
    }

    function fallbackToSingleCard() {
      const readingUrl = promoCode 
        ? `https://www.hamibook.com.tw/TopRanks/151?sales_code=${encodeURIComponent(promoCode)}` 
        : "https://www.hamibook.com.tw/TopRanks/151";

      flexMessagePayload = {
        type: "flex",
        altText: `好友向您推薦了【${category}】精選好書！`,
        contents: {
          type: "bubble",
          size: "kilo",
          hero: {
            type: "image",
            url: "https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600&auto=format&fit=crop",
            size: "full",
            aspectRatio: "16:9",
            aspectMode: "cover"
          },
          body: {
            type: "box",
            layout: "vertical",
            spacing: "sm",
            paddingAll: "16px",
            contents: [
              { type: "text", text: "🎁 好友贈書推薦", weight: "bold", size: "md", color: "#2C3E50" },
              { type: "text", text: `您的好友特別挑選了【${category}】的精選好書，邀請你前往 Hami書城 查看更多精采好書！`, size: "xs", color: "#666666", wrap: true }
            ]
          },
          footer: {
            type: "box",
            layout: "vertical",
            paddingAll: "12px",
            contents: [
              {
                type: "button",
                style: "primary",
                color: "#06C755",
                height: "sm",
                action: {
                  type: "uri",
                  label: "立即前往熱搜推薦榜",
                  uri: readingUrl
                }
              }
            ]
          }
        }
      };

      shareBtn.disabled = false;
      shareBtn.innerText = "挑選好友立即分享";
      statusText.innerText = "書單已就緒！點擊按鈕即可挑選好友發送。";
    }

    shareBtn.addEventListener('click', () => {
      if (!flexMessagePayload) return;
      shareBtn.disabled = true;
      statusText.innerText = "開啟挑選面板中...";

      liff.shareTargetPicker([flexMessagePayload])
        .then((res) => {
          if (res) {
            statusText.innerText = "✅ 分享成功！即將關閉視窗...";
            setTimeout(() => { liff.closeWindow(); }, 500);
          } else {
            shareBtn.disabled = false;
            statusText.innerText = "已取消分享";
          }
        })
        .catch((err) => {
          shareBtn.disabled = false;
          statusText.innerText = "發送未完成：" + err.message;
        });
    });
  </script>
