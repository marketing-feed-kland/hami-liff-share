<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 強制瀏覽器與 LINE 禁用本機快取 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>正在開啟好書分享...</title>
  <!-- 引入 LINE 官方 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e3e3e3;
      border-top: 4px solid #06C755;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      font-size: 15px;
      color: #444;
      line-height: 1.6;
    }
    .err-log {
      margin-top: 20px;
      padding: 12px;
      background: #ffebee;
      color: #c62828;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      word-break: break-all;
      display: none;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="statusText">正在連線 LINE 服務，請稍候...</div>
  <div class="err-log" id="errLog"></div>

  <script>
    // ⚠️ LINE Login Channel LIFF ID
    const MY_LIFF_ID = "2012185997-sJenhi1M";

    function showDebugError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("statusText").innerText = "❌ 啟動分享失敗";
      const errEl = document.getElementById("errLog");
      errEl.style.display = "block";
      errEl.innerText = msg;
    }

    function updateStatus(text) {
      document.getElementById("statusText").innerText = text;
    }

    async function main() {
      if (!MY_LIFF_ID || MY_LIFF_ID.includes("YOUR_LIFF_ID")) {
        showDebugError("錯誤：未填入正確的 MY_LIFF_ID，請至 GitHub index.html 設定真實 LIFF ID！");
        return;
      }

      try {
        updateStatus("正在驗證 LINE 授權 (liff.init)...");
        await liff.init({ liffId: MY_LIFF_ID });

        // 登入驗證
        if (!liff.isLoggedIn()) {
          updateStatus("引導登入授權中...");
          liff.login();
          return;
        }

        // 檢查環境支援度
        if (!liff.isApiAvailable("shareTargetPicker")) {
          showDebugError("您的環境不支援 shareTargetPicker，請確認後台開關為 ON 且在手機 LINE 內開啟！");
          return;
        }

        updateStatus("解析推廣參數中...");
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get("cat") || "熱門特惠";
        const salesCode = urlParams.get("code") || "PROMO";

        updateStatus("組裝專屬特惠書單卡片...");
        const flexMessage = buildStandardFlexCarousel(category, salesCode);

        updateStatus("正在喚起 LINE 原生好友選擇器...");
        const res = await liff.shareTargetPicker([flexMessage]);

        if (res) {
          updateStatus("✅ 卡片已成功發送！");
          setTimeout(() => liff.closeWindow(), 800);
        } else {
          updateStatus("已取消分享");
          setTimeout(() => liff.closeWindow(), 800);
        }

      } catch (err) {
        let detail = "";
        try {
          detail = JSON.stringify(err, Object.getOwnPropertyNames(err));
        } catch (e) {
          detail = err.message || err.toString();
        }
        showDebugError("錯誤詳情：" + (err.message || detail));
      }
    }

    // ── 組裝標準輪播卡片（含封面、書名、AI一句話、促銷價、原價刪除線、無限裂變末卡） ──
    function buildStandardFlexCarousel(category, salesCode) {
      const safeCat = category || "熱門特惠";
      const code = salesCode || "PROMO";
      
      const promoUrl = "https://hamibook.tw/sale/" + encodeURIComponent(code);
      const nextShareUrl = "https://liff.line.me/" + MY_LIFF_ID + "?cat=" + encodeURIComponent(safeCat) + "&code=" + encodeURIComponent(code);

      return {
        type: "flex",
        altText: `📚 好友為您推薦【${safeCat}】即將截止特價好書！`,
        contents: {
          type: "carousel",
          contents: [
            // 卡片 1：精選書籍卡片（展示原價刪除線與 AI 一句話推薦）
            {
              type: "bubble",
              size: "mega",
              hero: {
                type: "image",
                url: "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800&auto=format&fit=crop&q=60",
                size: "full",
                aspectRatio: "20:13",
                aspectMode: "cover"
              },
              body: {
                type: "box",
                layout: "vertical",
                spacing: "sm",
                paddingAll: "16px",
                contents: [
                  {
                    type: "text",
                    text: `【${safeCat}】限時精選好書`,
                    weight: "bold",
                    size: "md",
                    wrap: true
                  },
                  // AI 一句話推薦金句
                  {
                    type: "box",
                    layout: "horizontal",
                    spacing: "xs",
                    margin: "xs",
                    contents: [
                      {
                        type: "text",
                        text: "💡",
                        size: "xs",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "直擊痛點精選，限時特惠不容錯過的深度好書！",
                        size: "xs",
                        color: "#2e7d32",
                        wrap: true
                      }
                    ]
                  },
                  // 促銷價 vs 原價刪除線
                  {
                    type: "box",
                    layout: "baseline",
                    spacing: "sm",
                    margin: "md",
                    contents: [
                      {
                        type: "text",
                        text: "NT$ 99 起",
                        size: "lg",
                        color: "#ff334b",
                        weight: "bold",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "NT$ 320",
                        size: "xs",
                        color: "#aaaaaa",
                        decoration: "line-through",
                        flex: 0
                      },
                      {
                        type: "text",
                        text: "即將截止",
                        size: "xxs",
                        color: "#ff8800",
                        align: "end"
                      }
                    ]
                  }
                ]
              },
              footer: {
                type: "box",
                layout: "vertical",
                spacing: "xs",
                paddingAll: "12px",
                contents: [
                  {
                    type: "button",
                    style: "primary",
                    color: "#4A90E2",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "立即查看促銷書單",
                      uri: promoUrl
                    }
                  }
                ]
              }
            },
            // 卡片 2：無限二次裂變分享末卡
            {
              type: "bubble",
              size: "mega",
              body: {
                type: "box",
                layout: "vertical",
                justifyContent: "center",
                alignItems: "center",
                spacing: "md",
                paddingAll: "20px",
                contents: [
                  {
                    type: "text",
                    text: "🎁 好康相報",
                    weight: "bold",
                    size: "xl"
                  },
                  {
                    type: "text",
                    text: `推薦碼：${code}\n覺得這批好書超值？把這份限時特惠一鍵分享給愛閱讀的朋友！`,
                    size: "xs",
                    color: "#666666",
                    align: "center",
                    wrap: true
                  },
                  {
                    type: "button",
                    style: "primary",
                    color: "#06C755",
                    margin: "md",
                    height: "sm",
                    action: {
                      type: "uri",
                      label: "一鍵分享朋友",
                      uri: nextShareUrl
                    }
                  }
                ]
              }
            }
          ]
        }
      };
    }

    main();
  </script>
</body>
</html>
