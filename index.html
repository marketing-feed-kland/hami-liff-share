<script>
    const MY_LIFF_ID = "2012185997-sJenhi1M";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwaUAUg-ZDW11diWDz7bByzZljprXtBZv6qWGjRSpbRZFqEAJeFzc9ECjpjXqm8XyuE/exec";

    let cachedFlexMessage = null;

    function showDebugError(msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("headerIcon").style.display = "block";
      document.getElementById("headerIcon").innerText = "⚠️";
      document.getElementById("mainTitle").innerText = "載入失敗";
      document.getElementById("statusText").innerText = "無法取得促銷書單";
      const errEl = document.getElementById("errLog");
      errEl.style.display = "block";
      errEl.innerText = msg;
    }

    function updateStatus(title, text) {
      if (title) document.getElementById("mainTitle").innerText = title;
      if (text) document.getElementById("statusText").innerText = text;
    }

    async function main() {
      try {
        updateStatus("連線診斷", "步驟 1：啟動 LIFF SDK...");
        await liff.init({ liffId: MY_LIFF_ID });

        updateStatus("連線診斷", "步驟 2：檢查環境...");
        if (!liff.isInClient()) {
          showDebugError("請在手機 LINE 內點擊好書卡片開啟！外部瀏覽器不支援發送好友卡片。");
          return;
        }

        updateStatus("連線診斷", "步驟 3：確認登入狀態...");
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get("cat") || "熱門特惠";
        const salesCode = urlParams.get("code") || "DEFAULT";

        updateStatus("連線診斷", `步驟 4：請求【${category}】書單...`);

        const fetchUrl = `${GAS_API_URL}?cat=${encodeURIComponent(category)}&code=${encodeURIComponent(salesCode)}`;
        const response = await fetch(fetchUrl);
        const resJson = await response.json();

        if (resJson.status !== "success" || !resJson.data || resJson.data.length === 0) {
          throw new Error("後端回傳格式非 success，或無書籍資料：" + JSON.stringify(resJson));
        }

        updateStatus("連線診斷", "步驟 5：過濾與轉換合規卡片格式...");

        // ── 關鍵修復：將後端回傳的 postback 全數轉為合規的 uri 導購連結 ──
        const sanitizedBubbles = resJson.data.map(bubble => {
          const b = JSON.parse(JSON.stringify(bubble));
          if (b.footer && b.footer.contents) {
            b.footer.contents = b.footer.contents.map(item => {
              if (item.action && item.action.type === "postback") {
                // 將 postback 轉換為安全的 uri 連結
                const dataStr = item.action.data || "";
                let bookId = "0000000000";
                const match = dataStr.match(/book_id=([^&]+)/);
                if (match) bookId = match[1];

                const targetUrl = `https://www.hamibook.com.tw/detail/${bookId}?sales_code=${encodeURIComponent(salesCode)}`;
                return {
                  type: "button",
                  style: "primary",
                  color: "#2C3E50",
                  height: "sm",
                  action: {
                    type: "uri",
                    label: "前往閱讀",
                    uri: targetUrl
                  }
                };
              }
              return item;
            });
          }
          return b;
        });

        cachedFlexMessage = {
          type: "flex",
          altText: `📚 好友為您推薦【${category}】精選特價好書！`,
          contents: {
            type: "carousel",
            contents: sanitizedBubbles
          }
        };

        // 成功載入，點亮按鈕
        document.getElementById("spinner").style.display = "none";
        document.getElementById("headerIcon").style.display = "block";
        updateStatus(`【${category}】精選好書`, "好書卡片已準備就緒，點擊下方按鈕即可選擇好友或群組分享！");
        document.getElementById("shareBtn").style.display = "block";

      } catch (err) {
        showDebugError("執行中斷：" + (err.message || JSON.stringify(err)));
      }
    }

    async function handleShareClick() {
      if (!cachedFlexMessage) return;

      const btn = document.getElementById("shareBtn");
      btn.disabled = true;
      btn.innerText = "正在開啟好友選單...";

      try {
        if (!liff.isApiAvailable("shareTargetPicker")) {
          throw new Error("此環境不支援 ShareTargetPicker，請確認 LINE App 是否更新至最新版。");
        }

        const res = await liff.shareTargetPicker([cachedFlexMessage]);
        if (res) {
          updateStatus("發送成功！", "特惠書單已成功分享給好友！視窗即將關閉...");
          btn.style.display = "none";
          setTimeout(() => liff.closeWindow(), 1000);
        } else {
          btn.disabled = false;
          btn.innerText = "選擇好友／群組發送書單";
          updateStatus("未發送", "您已取消選擇，隨時可再次點擊分享。");
        }
      } catch (error) {
        btn.disabled = false;
        btn.innerText = "重新嘗試發送";
        showDebugError("發送失敗：" + (error.message || JSON.stringify(error)));
      }
    }

    main();
  </script>
